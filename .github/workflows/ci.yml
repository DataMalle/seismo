name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint och tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dbt:
    name: dbt parse (ingen warehouse-anslutning krävs)
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: dbt
      DBT_TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # parse kompilerar hela projektet (modeller, makron, tester, kontrakt och enhetstester) utan att nå Databricks.
      # --warn-error gör att även föråldrade konventioner stoppar bygget.
      - run: dbt parse --project-dir dbt --warn-error
