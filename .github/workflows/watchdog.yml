name: Watchdog (färskhets-SLA)

# Körs utanför Databricks med flit: en pipeline som stannat kan inte larma om sig själv.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install databricks-sdk
      - id: check
        run: python ops/watchdog.py

      - name: Öppna eller uppdatera issue när SLA bryts
        if: steps.check.outputs.ok == 'false'
        uses: actions/github-script@v7
        env:
          REASONS: ${{ steps.check.outputs.reasons }}
        with:
          script: |
            const title = "Datafärskhet: SLA bruten";
            const body = `Watchdog hittade ett problem:\n\n${process.env.REASONS}\n\nÅtgärder finns i [runbooken](../blob/main/docs/runbook.md).`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "data-sla" });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["data-sla"] });
            }

      - name: Stäng issue när pipelinen är frisk igen
        if: steps.check.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "data-sla" });
            for (const issue of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: "Pipelinen är inom SLA igen. Stänger." });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }
