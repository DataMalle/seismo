name: Deploy

# Manuell utrullning av jobb och notebooks till Databricks. Kör aldrig automatiskt: produktion ska ändras med avsikt.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Miljö att rulla ut till
        type: choice
        options: [prod, dev]
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t ${{ inputs.target }}
      - run: databricks bundle deploy -t ${{ inputs.target }}
