[project]
name = "seismo"
version = "1.0.0"
description = "Live lakehouse-plattform över USGS-jordbävningsdata: CDC, dbt, datakontrakt och AI-berikning på Databricks"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["pipeline", "app", "ops"]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: kontraktstester mot det riktiga USGS-API:et (kräver nätverk). Kör med pytest -m live"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["pipeline", "app", "ops", "tests"]
builtins = ["spark", "dbutils", "display"]  # globaler i Databricks-notebooks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # svenska tecken och typografiska tankstreck i text

[tool.ruff.lint.per-file-ignores]
"app/style.py" = ["E501"]  # CSS
"app/app.py" = ["E501"]  # UI-texter och graphviz-definition
"pipeline/0*.py" = ["E402", "E501"]  # notebooks: importer i senare celler och långa markdown-rader
"ops/benchmark_layouts.py" = ["E501"]  # SQL-mallar och markdown
