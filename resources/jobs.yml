resources:
  jobs:
    seismo_pipeline:
      name: seismo-pipeline
      description: >
        USGS ändringsfeed -> landing -> bronze (Auto Loader) -> dbt (silver, gold, tester, freshness, AI-berikning).
        Körs varje timme.
      max_concurrent_runs: 1 # en körning i taget, så att watermark och MERGE aldrig tävlar
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_status}
      parameters:
        - {name: catalog, default: "${var.catalog}"}
        - {name: env, default: "${var.env}"}
        - {name: mode, default: incremental}
        - {name: bootstrap_days, default: "7"}
        - {name: backfill_start, default: ""}
        - {name: backfill_end, default: ""}
      environments:
        - environment_key: dbt
          spec:
            environment_version: "3"
            dependencies:
              - dbt-databricks>=1.9,<2
      tasks:
        - task_key: poll_usgs
          # USGS ger ibland 502/504 under korta avbrott. Extraktionen är idempotent, så den kan köras om säkert.
          max_retries: 2
          min_retry_interval_millis: 180000
          notebook_task:
            notebook_path: ../pipeline/01_poll_usgs.py

        - task_key: bronze_stream
          depends_on: [{task_key: poll_usgs}]
          notebook_task:
            notebook_path: ../pipeline/02_bronze_stream.py

        # En enda dbt-task med tre kommandon i följd. Varje dbt-task betalar en egen miljöstart (mätt: freshness-kommandot
        # tog 3 s men tasken 3,8 min), så kommandona delar task. Ordningen bevarar isoleringen: kärndata är publicerad innan
        # freshness och AI-steget körs, och dbt stoppar vid första felande kommandot.
        # Profilen genereras av Databricks (target databricks_cluster, jobbets identitet). Miljön styrs med --vars env.
        - task_key: dbt
          depends_on: [{task_key: bronze_stream}]
          environment_key: dbt
          dbt_task:
            project_directory: ../dbt
            commands:
              - "dbt build --exclude tag:ai --target databricks_cluster --vars '{env: ${var.env}}'"
              - "dbt source freshness --target databricks_cluster --vars '{env: ${var.env}}'"
              - "dbt build --select tag:ai --target databricks_cluster --vars '{env: ${var.env}}'"
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
