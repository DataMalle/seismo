version: 2

sources:
  - name: bronze
    description: Råa, append-only landningstabeller skrivna av Auto Loader. Schema-on-read sker i staging.
    schema: "{{ 'seismo' if var('env', target.name) == 'prod' else 'seismo_' ~ var('env', target.name) }}_bronze"
    tables:
      - name: usgs_events
        description: En rad per *version* av varje USGS-händelse (ändringslogg), med råpayload som text.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 3, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: event_id
            data_tests: [not_null]
          - name: updated_ms
            data_tests: [not_null]
      - name: usgs_events_quarantine
        description: Rader som saknar id eller updated. Ska vara tom.

  - name: ops
    description: Driftdata som pipelinen själv skriver.
    schema: "{{ 'seismo' if var('env', target.name) == 'prod' else 'seismo_' ~ var('env', target.name) }}_ops"
    tables:
      - name: poll_log
        description: En rad per extraktionskörning. Fungerar som pipelinens hjärtslag.
        config:
          loaded_at_field: polled_at
          freshness: # SLA: jobbet körs varje timme
            warn_after: {count: 90, period: minute}
            error_after: {count: 3, period: hour}
