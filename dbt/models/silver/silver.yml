version: 2

models:
  - name: events
    description: >
      Senaste kända version av varje USGS-händelse (en rad per händelse). Inkrementell MERGE på inläsningstid.
      Raderade händelser behålls med `is_deleted = true` istället för att försvinna.
    columns:
      - name: event_id
        description: USGS händelse-id.
        data_tests: [unique, not_null]
      - name: event_time
        description: När skalvet inträffade (UTC).
        data_tests: [not_null]
      - name: updated_at
        description: När USGS senast ändrade händelsen. Versionen av raden.
        data_tests: [not_null]
      - name: magnitude
        data_tests:
          - value_between: {arguments: {min_value: -2, max_value: 10}}
      - name: locality
        description: Orten ur `place` utan avstånd och riktning, t.ex. "Ridgecrest, CA". Nyckel till event_locations.
      - name: distance_km
        description: Avstånd till orten, utplockat med regex ur `place`.
      - name: direction
        description: Riktning till orten (N, SSW …), utplockad med regex.
      - name: is_deleted
        description: Sant om USGS har raderat händelsen.
        data_tests: [not_null]

  - name: event_history
    description: >
      SCD2: en rad per version av varje händelse med giltighetsintervall, revisionsnummer och magnitudförändring.
      Besvarar t.ex. hur ofta och hur mycket USGS reviderar magnituder.
    columns:
      - name: event_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: revision_number
        description: 1 för första versionen, därefter 2, 3 …
        data_tests: [not_null]
      - name: is_current
        description: Sant för den senaste versionen av händelsen.

  - name: event_locations
    description: >
      LLM-extraherad geografi (land, region, platstyp) per ortsbeskrivning. Cachas per ort, har ett kostnadstak per körning
      och valideras. Ogiltiga svar flaggas med `is_valid = false`.
    columns:
      - name: locality
        description: Ortsbeskrivning, nyckel.
        data_tests: [unique, not_null]
      - name: location_type
        description: city, region, ocean eller unknown.
        data_tests:
          - accepted_values:
              arguments:
                values: [city, region, ocean, unknown]
              config: {severity: warn}
      - name: is_valid
        description: Sant om svaret gick att tolka och uppfyller kontraktet.
        data_tests: [not_null]

unit_tests:
  - name: events_keeps_only_the_latest_version_and_flags_deletions
    description: Flera versioner av samma händelse ger en rad med den senaste, och status deleted flaggas.
    model: events
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_usgs_event_versions')
        rows:
          - {event_id: x, updated_ms: 100, updated_at: "2026-10-15 10:00:00", event_time: "2026-10-15 09:00:00",
             magnitude: 2.0, place: "10 km N of Town, CA", review_status: automatic, ingested_at: "2026-10-15 10:01:00"}
          - {event_id: x, updated_ms: 200, updated_at: "2026-10-15 11:00:00", event_time: "2026-10-15 09:00:00",
             magnitude: 2.4, place: "10 km N of Town, CA", review_status: reviewed, ingested_at: "2026-10-15 11:01:00"}
          - {event_id: y, updated_ms: 300, updated_at: "2026-10-15 12:00:00", event_time: "2026-10-15 08:00:00",
             magnitude: 1.0, place: "Somewhere", review_status: deleted, ingested_at: "2026-10-15 12:01:00"}
    expect:
      rows:
        - {event_id: x, magnitude: 2.4, review_status: reviewed, is_deleted: false}
        - {event_id: y, magnitude: 1.0, review_status: deleted, is_deleted: true}

  - name: events_extracts_distance_direction_and_locality_with_regex
    description: Avstånd, riktning och ort plockas ut deterministiskt, utan LLM.
    model: events
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_usgs_event_versions')
        rows:
          - {event_id: p, updated_ms: 1, updated_at: "2026-10-15 10:00:00", event_time: "2026-10-15 09:00:00",
             place: "123 km NW of Hachijo-jima, Japan", ingested_at: "2026-10-15 10:01:00"}
          - {event_id: q, updated_ms: 1, updated_at: "2026-10-15 10:00:00", event_time: "2026-10-15 09:00:00",
             place: "Southern Alaska", ingested_at: "2026-10-15 10:01:00"}
    expect:
      rows:
        - {event_id: p, locality: "Hachijo-jima, Japan", distance_km: 123.0, direction: NW}
        - {event_id: q, locality: "Southern Alaska", distance_km: null, direction: null}
