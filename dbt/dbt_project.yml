name: seismo
version: "1.0.0"
config-version: 2
profile: seismo

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  env: "{{ target.name }}" # prod -> schemat seismo_*, annars seismo_<env>_*. Se macros/schema.sql
  llm_endpoint: databricks-meta-llama-3-3-70b-instruct
  llm_batch_size: 100 # högst så många nya platsbeskrivningar per körning (kostnadstak)
  prompt_version: v1

models:
  seismo:
    +persist_docs: # beskrivningar i YAML skrivs som kommentarer i Unity Catalog
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: silver
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
      +on_schema_change: fail # kontrakt: oväntade schemaändringar ska stoppa körningen, inte tyst spridas

tests:
  seismo:
    +store_failures: true # underkända rader sparas i ops-schemat för felsökning
    +schema: ops
